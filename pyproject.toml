[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-reviews-streaming-pipeline"
version = "1.0.0"
description = "End-to-end data engineering project for batch training, Kafka streaming, MongoDB storage, and Flask analytics."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Youssef" }
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

